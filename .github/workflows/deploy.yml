name: Deploy production
on:
  workflow_run:
    workflows: [Backend CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://intellicoretech.cn/admin/
    steps:
      - name: Deploy the tested revision over verified SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_USER: ${{ vars.SERVER_USER }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/deploy "$SERVER_USER@$SERVER_HOST" "deploy-backend.sh main $REVISION"
      - name: Verify the public origin and API gateway
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 --retry 4 --retry-all-errors https://backend.intellicoretech.cn/healthz |
            jq -e '.status == "ok" and .service == null'
          curl --fail --silent --show-error --max-time 15 --retry 4 --retry-all-errors https://intellicoretech.cn/api/v1/dashboard/stats |
            jq -e '.code == 200 and (.data.totalAssess | type == "number")'
